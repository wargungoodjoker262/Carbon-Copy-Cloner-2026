name: Auto Commit 3
on:
  schedule:
    - cron: "21 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  auto-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update timestamp
        run: |
          echo "Last automatic commit: $(date -u '+%Y-%m-%d %H:%M:%S UTC') - #3" > auto_commit_timestamp_3.txt
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auto_commit_timestamp_3.txt
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: automatic update 3"
          git push
